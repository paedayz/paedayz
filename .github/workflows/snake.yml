name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0582ca&color_dots=#e3f6fb,#90e0ef,#48cae4,#0582ca,#03203c
            dist/github-contribution-grid-snake-dark.svg?color_snake=#caf0f8&color_dots=#0a1f33,#0a3d62,#0582ca,#00b4d8,#90e0ef&color_dot_border=#03203c

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
